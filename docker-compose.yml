services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-model-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull llama3.2 && ollama pull nomic-embed-text
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  rag:
    build:
      context: .
      dockerfile: enceladus-ai-demo-rag/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgvector:5432/ragdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8080:8080"
    depends_on:
      pgvector:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully

  dashboard:
    build:
      context: .
      dockerfile: enceladus-ai-demo-dashboard/Dockerfile
    expose:
      - "80"
      - "8081"
    environment:
      - PORT=80
      - app.backend.url="http://backend/"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: enceladus-ai-demo-backend/Dockerfile
    expose:
      - "80"
      - "8081"
    environment:
      - PORT=80


  nginx:
    build: enceladus-ai-demo-devops/praanvaayu.io/nginx
    ports:
      - "80:80"
    expose:
      - "80"
    links:
      - backend
      - dashboard
    depends_on:
      - backend
      - dashboard

volumes:
  pgvector-data:
  ollama-models:
