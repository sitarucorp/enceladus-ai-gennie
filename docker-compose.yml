services:
  dashboard:
    build:
      context: .
      dockerfile: enceladus-ai-demo-dashboard/Dockerfile
    expose:
      - "80"
      - "8081"
    environment:
      - PORT=80
      - app.backend.url="http://backend/"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: enceladus-ai-demo-backend/Dockerfile
    expose:
      - "80"
      - "8081"
    environment:
      - PORT=80


  nginx:
    build: enceladus-ai-demo-devops/praanvaayu.io/nginx
    ports:
      - "80:80"
    expose:
      - "80"
    links:
      - backend
      - dashboard
    depends_on:
      - backend
      - dashboard
