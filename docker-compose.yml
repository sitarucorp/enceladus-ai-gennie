services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "5"
      OLLAMA_KEEP_ALIVE: "5m"
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-model-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if ! ollama list | grep -Fq 'llama3.2:latest'; then
          ollama pull llama3.2
        fi
        if ! ollama list | grep -Fq 'nomic-embed-text:latest'; then
          ollama pull nomic-embed-text
        fi
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  rag:
    build:
      context: .
      dockerfile: enceladus-ai-demo-rag/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgvector:5432/ragdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8080:8080"
    expose:
      - 8080
    depends_on:
      pgvector:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully

  dashboard:
    build:
      context: .
      dockerfile: enceladus-ai-demo-dashboard/Dockerfile
    expose:
      - "80"
      - "8081"
    environment:
      PORT: 80
      APP_BACKEND_URL: http://backend/
      SERVER_SERVLET_CONTEXT_PATH: /dashboard
      SERVER_FORWARD_HEADERS_STRATEGY: native
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: enceladus-ai-demo-backend/Dockerfile
    expose:
      - "80"
      - "8081"
    environment:
      - PORT=80


  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    expose:
      - "80"
    volumes:
      - ./enceladus-demo-devops/praanvaayu.io/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./enceladus-demo-devops/praanvaayu.io/nginx/html:/usr/share/nginx/html
    links:
      - backend
      - dashboard
      - rag
    depends_on:
      - backend
      - dashboard
      - rag

networks:
  default:
    name: enceladus-ai-gennie-network

volumes:
  pgvector-data:
  ollama-models:
