events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /anomaly {
            root /usr/share/nginx/html;
            index anomaly.html;
            add_header Content-Security-Policy "default-src 'self'; report-uri /csp-report;";
        }

        location /backend {
             proxy_pass http://backend/;
             proxy_set_header Host $host;
             proxy_set_header Accept application/json;
             proxy_set_header X-Tenant "UHJhYW5WYWF5dQo=";
             proxy_set_header X-Real-IP $remote_addr;
        }

        location = /dashboard {
            return 301 /dashboard/;
        }

        location /dashboard/ {
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant "UHJhYW5WYWF5dQo=";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /rag {
            return 301 /rag/;
        }
        location /rag {
            proxy_pass http://rag:8080;
            proxy_set_header Host $host;
            proxy_set_header Accept application/json;
            proxy_set_header X-Tenant "UHJhYW5WYWF5dQo=";
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /csp-report {
            proxy_pass http://dashboard/dashboard/csp-report;
            proxy_set_header Host $host;
            proxy_set_header Accept application/json;
	        proxy_set_header X-Tenant "UHJhYW5WYWF5dQo=";
	        proxy_set_header X-Real-IP $remote_addr;
        }

        location /version {
             proxy_pass http://dashboard/dashboard/api/version;
             proxy_set_header Host $host;
             proxy_set_header Accept application/json;
        	 proxy_set_header X-Tenant "UHJhYW5WYWF5dQo=";
        	 proxy_set_header X-Real-IP $remote_addr;
        }

    }
}
